# Shipped by luci-app-ocserv. Tunnels of ocserv/openconnect run over TCP when UDP is off, so user
# traffic is TCP inside TCP; with cubic that is several times slower than with bbr.
# Only the default for new connections: running tunnels keep cubic until they reconnect.
# OpenWrt has no sch_fq, so the default qdisc stays as it is (bbr works without fq).
net.ipv4.tcp_congestion_control=bbr
